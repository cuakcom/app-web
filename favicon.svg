<svg viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="circleClip">
      <circle cx="140" cy="140" r="122"/>
    </clipPath>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#ff2d95"/>
      <stop offset="50%" stop-color="#ff8c42"/>
      <stop offset="100%" stop-color="#ffd93d"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="70%">
      <stop offset="0%"  stop-color="#3a1466"/>
      <stop offset="100%" stop-color="#160726"/>
    </radialGradient>
  </defs>

  <!-- Outer pop ring -->
  <circle cx="140" cy="140" r="132" fill="none" stroke="url(#ringGrad)" stroke-width="14"/>

  <g clip-path="url(#circleClip)">
    <!-- Background -->
    <circle cx="140" cy="140" r="122" fill="url(#bgGrad)"/>

    <!-- Pop-art sunburst rays -->
    <g id="rays">
      <polygon points="140,140 158,18 122,18"   fill="#ff2d95" opacity="0.9"/>
      <polygon points="140,140 200,32 178,10"   fill="#ffd93d" opacity="0.85"/>
      <polygon points="140,140 238,70 210,42"   fill="#ff8c42" opacity="0.85"/>
      <polygon points="140,140 262,120 232,104" fill="#ffd93d" opacity="0.8"/>
      <polygon points="140,140 262,180 232,176" fill="#ff2d95" opacity="0.8"/>
      <polygon points="140,140 232,236 210,216" fill="#ff8c42" opacity="0.85"/>
      <polygon points="140,140 178,270 158,262" fill="#ffd93d" opacity="0.85"/>
      <polygon points="140,140 100,270 122,262" fill="#ff2d95" opacity="0.85"/>
      <polygon points="140,140 48,236 70,216"   fill="#ff8c42" opacity="0.85"/>
      <polygon points="140,140 18,180 48,176"   fill="#ffd93d" opacity="0.8"/>
      <polygon points="140,140 18,120 48,104"   fill="#ff2d95" opacity="0.8"/>
      <polygon points="140,140 42,32 70,42"     fill="#ff8c42" opacity="0.85"/>
    </g>
    <circle cx="140" cy="140" r="122" fill="#160726" opacity="0.18"/>

    <!-- ============ SILUETA GUITARRISTA (duck walk) ============ -->
    <g stroke="#0a0a0a" fill="#0a0a0a" stroke-linecap="round" stroke-linejoin="round">

      <!-- Sombra en el suelo -->
      <ellipse cx="150" cy="236" rx="70" ry="8" fill="#0a0a0a" opacity="0.35" stroke="none"/>

      <!-- Pierna trasera: cadera -> rodilla -> pie (extendida y alta, patada icónica) -->
      <path d="M 150 150 L 200 168 L 248 182" fill="none" stroke-width="17"/>
      <ellipse cx="252" cy="184" rx="10" ry="6" stroke="none"/>

      <!-- Pierna delantera: cadera -> rodilla -> pie (en cuclillas, agachada) -->
      <path d="M 150 150 L 118 188 L 138 233" fill="none" stroke-width="17"/>
      <ellipse cx="140" cy="238" rx="12" ry="7" stroke="none"/>

      <!-- Torso reclinado hacia atrás -->
      <path d="M 150 150 C 148 128 156 104 176 90 L 190 100 C 172 112 164 132 166 152 Z" stroke="none"/>

      <!-- Cabeza (sin rasgos faciales) -->
      <circle cx="182" cy="76" r="17" stroke="none"/>

      <!-- Brazo trasero (rasgueo, hacia el cuerpo de la guitarra) -->
      <path d="M 178 98 L 152 118 L 172 148" fill="none" stroke-width="13"/>

      <!-- Cuerpo de la guitarra -->
      <g transform="rotate(-24 176 158)">
        <ellipse cx="176" cy="158" rx="36" ry="25" stroke="none"/>
        <circle cx="176" cy="158" r="9" fill="#160726" stroke="none"/>
      </g>

      <!-- Mástil de la guitarra -->
      <path d="M 202 142 L 250 92" fill="none" stroke-width="7"/>
      <rect x="246" y="80" width="14" height="16" rx="3" transform="rotate(45 253 88)" stroke="none"/>

      <!-- Brazo delantero (sujeta el mástil) -->
      <path d="M 178 96 L 222 112" fill="none" stroke-width="12"/>

      <!-- Cable/correa -->
      <path d="M 176 96 L 118 188" fill="none" stroke="#0a0a0a" stroke-width="4" opacity="0.6"/>
    </g>
  </g>

  <!-- Borde interior sutil -->
  <circle cx="140" cy="140" r="122" fill="none" stroke="#0a0a0a" stroke-width="2" opacity="0.25"/>
</svg>
