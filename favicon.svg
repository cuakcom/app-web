<svg viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .circle-border { stroke: #4a4a4a; stroke-width: 18; fill: #ffffff; }
      .head { fill: #c85a4a; }
      .skin { fill: #e8b8a0; }
      .body { fill: #f5f5f5; stroke: #1a1a1a; stroke-width: 2.5; }
      .dark { fill: #1a1a1a; }
      .outline { stroke: #1a1a1a; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .neon { stroke: #ff8c42; fill: none; stroke-width: 3; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Circle border -->
  <circle cx="140" cy="140" r="130" class="circle-border"/>

  <!-- Skateboard deck -->
  <ellipse cx="140" cy="210" rx="55" ry="15" class="dark"/>
  <ellipse cx="140" cy="208" rx="55" ry="12" fill="#2a2a2a"/>

  <!-- Skateboard wheels -->
  <circle cx="105" cy="213" r="7" class="dark"/>
  <circle cx="175" cy="213" r="7" class="dark"/>

  <!-- Ground line -->
  <line x1="70" y1="225" x2="210" y2="225" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Head -->
  <circle cx="140" cy="75" r="24" class="head"/>

  <!-- Hair -->
  <path d="M 118 68 Q 110 45 140 38 Q 170 45 162 68" class="head" stroke="#8b4513" stroke-width="1.5"/>

  <!-- Face details -->
  <circle cx="132" cy="72" r="2.5" fill="#000"/>
  <circle cx="148" cy="72" r="2.5" fill="#000"/>
  <path d="M 132 82 Q 140 85 148 82" class="outline" stroke-width="1.5"/>

  <!-- Body/Shirt -->
  <rect x="115" y="100" width="50" height="50" rx="3" class="body"/>
  <line x1="140" y1="100" x2="140" y2="150" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Left arm (extended) -->
  <line x1="115" y1="115" x2="55" y2="90" stroke="#e8b8a0" stroke-width="6" stroke-linecap="round"/>
  <circle cx="50" cy="87" r="5" class="skin"/>

  <!-- Right arm (raised) -->
  <line x1="165" y1="110" x2="195" y2="70" stroke="#e8b8a0" stroke-width="6" stroke-linecap="round"/>
  <circle cx="200" cy="67" r="5" class="skin"/>

  <!-- Left leg (kicking high) -->
  <line x1="120" y1="150" x2="75" y2="50" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="68" cy="42" rx="11" ry="8" class="dark"/>

  <!-- Right leg (on skateboard) -->
  <line x1="160" y1="150" x2="160" y2="205" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="160" cy="212" rx="8" ry="6" class="dark"/>

  <!-- Belt -->
  <rect x="115" y="148" width="50" height="3" class="dark"/>

  <!-- Orange accent curve (left side) -->
  <path d="M 50 120 Q 40 100 35 70" class="neon"/>

  <!-- Orange accent arc (right side - main swoosh) -->
  <path d="M 190 200 Q 220 160 235 120" class="neon"/>

  <!-- Orange star burst -->
  <g transform="translate(140, 235)">
    <polygon points="0,-10 3,-3 10,-1 3,3 4,10 0,6 -4,10 -3,3 -10,-1 -3,-3" class="dark" fill="#ff8c42"/>
  </g>

  <!-- Additional motion lines -->
  <path d="M 55 110 Q 50 105 48 100" class="neon" stroke-width="2"/>
</svg>